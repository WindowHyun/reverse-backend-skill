spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
jwt:
  secret: ${JWT_SECRET:changeme-changeme-changeme-changeme}
  ttl-hours: 168
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
springdoc:
  api-docs:
    path: /v3/api-docs
